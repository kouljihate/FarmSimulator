<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ tl('MODEL_NAME')[0] }} - {{ tl('PART1')[0] }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { primary: '#2c3e50', accent: '#18bc9c' },
        fontFamily: {
          sans: ["Comfortaa", "'Segoe UI'", "sans-serif"],
          arabic: ["'VIP RAWY Regular'", "'Rawy'", "'Tahoma'", "sans-serif"],
        },
      },
    },
  };
</script>
<style>
  /* VIP RAWY Regular - drop the font file into static/fonts/  */
  @font-face {
    font-family: 'VIP RAWY Regular';
    src: url('/static/fonts/VIP RAWY REGULAR REGULAR.TTF') format('truetype');
    font-weight: 400;
    font-style: normal;
  }
  {{ i18n_css()|safe }}
  iframe.map { width: 100%; height: 300px; border: 0; border-radius: .5rem; }
  iframe.map.big { height: 440px; }
  main { padding-bottom: 3rem; }
  .sw { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; }
  .tab-btn { padding: .5rem 1rem; font-weight: 600; font-size: .875rem; color: #64748b; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab-btn:hover { color: #1e293b; }
  .tab-btn.active-tab { color: #0f766e; border-bottom-color: #18bc9c; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
</style>
</head>
<body class="bg-gray-50 font-sans text-gray-900" dir="ltr">

<nav class="bg-primary text-white">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-3">
    <a class="text-lg font-bold" href="/">{{ tl('MODEL_NAME')[0] }}</a>
    <span class="text-sm text-white/70" style="font-family:'VIP RAWY Regular';direction:rtl">{{ tl('MODEL_NAME')[1] }}</span>
  </div>
</nav>

<main class="mx-auto max-w-7xl px-4 py-5">
  {% block content %}{% endblock %}
</main>

</body>
</html>
