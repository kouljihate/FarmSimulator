<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ tl('MODEL_NAME')[0] }} - {{ tl('PART1')[0] }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ["Comfortaa", "'Segoe UI'", "sans-serif"],
          arabic: ["'VIP RAWY Regular'", "'Rawy'", "'Tahoma'", "sans-serif"],
        },
        colors: {
          primary: '#0e7490',
          accent: '#18bc9c',
          neon: { cyan: '#22d3ee', violet: '#8b5cf6', fuchsia: '#d946ef' },
        },
      },
    },
  };
</script>
<style>
  /* VIP RAWY Regular - drop the font file into static/fonts/  */
  @font-face {
    font-family: 'VIP RAWY Regular';
    src: url('/static/fonts/VIP RAWY REGULAR REGULAR.TTF') format('truetype');
    font-weight: 400;
    font-style: normal;
  }
  {{ i18n_css()|safe }}

  body {
    background:
      radial-gradient(1100px 550px at 12% -8%, rgba(34,211,238,.16), transparent 55%),
      radial-gradient(900px 600px at 88% 110%, rgba(217,70,239,.13), transparent 55%),
      radial-gradient(700px 400px at 60% 30%, rgba(99,102,241,.10), transparent 60%),
      linear-gradient(rgba(103,232,249,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(103,232,249,.045) 1px, transparent 1px),
      #070b14;
    background-size: 100% 100%, 100% 100%, 100% 100%, 42px 42px, 42px 42px, 100% 100%;
    color: #eef2ff;
  }

  ::selection { background: rgba(34,211,238,.35); }

  .glass {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(2,6,23,.45), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .glass-head {
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.035);
  }
  .glow-btn {
    background: linear-gradient(135deg, #22d3ee, #8b5cf6 55%, #d946ef);
    color: #fff;
    transition: all .2s ease;
  }
  .glow-btn:hover {
    filter: brightness(1.12);
    box-shadow: 0 0 26px rgba(139,92,246,.5);
    transform: translateY(-1px);
  }
  .ring-btn {
    color: #c7d2fe;
    border: 1px solid rgba(255,255,255,.25);
    transition: all .2s ease;
  }
  .ring-btn:hover { background: rgba(255,255,255,.08); box-shadow: 0 0 18px rgba(99,102,241,.3); }

  .tab-btn {
    padding: .5rem 1.25rem;
    border-radius: 9999px;
    font-weight: 600;
    font-size: .875rem;
    color: #fff;
    opacity: .55;
    border: 1px solid transparent;
    transition: all .2s ease;
    white-space: nowrap;
  }
  .tab-btn:hover { opacity: .9; }
  .tab-btn.active-tab {
    background: linear-gradient(135deg, #22d3ee, #8b5cf6);
    opacity: 1;
    box-shadow: 0 0 20px rgba(139,92,246,.5);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .tab-btn .ar { font-size: .85rem; }

  .inl .di, .legend .di, table .di { display: inline-flex; gap: .4rem; flex-wrap: wrap; }
  .inl .di > .ar, .legend .di > .ar, table .di > .ar { font-size: .95em; align-self: center; }

  iframe.map { width: 100%; height: 300px; border: 0; border-radius: .75rem; box-shadow: 0 0 22px rgba(34,211,238,.08); }
  iframe.map.big { height: 440px; }
  iframe.map.tall { height: 560px; }
  main { padding-bottom: 3rem; }
  .sw { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; box-shadow: 0 0 6px rgba(255,255,255,.35); }

  .sector-check {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: .3rem .8rem;
    border-radius: .6rem;
    border: 1px solid rgba(139,92,246,.55);
    background: linear-gradient(135deg, rgba(34,211,238,.22), rgba(139,92,246,.32));
    color: #fff;
    font-size: .72rem;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    transition: all .18s ease;
    box-shadow: 0 0 10px rgba(139,92,246,.25);
  }
  .sector-check:hover { border-color: #22d3ee; box-shadow: 0 0 14px rgba(34,211,238,.45); transform: translateY(-1px); }
  .sector-chk { display: none; }
  .sector-check:has(.sector-chk:checked) {
    border-color: transparent;
    background: linear-gradient(135deg, #22d3ee, #8b5cf6);
    box-shadow: 0 0 16px rgba(139,92,246,.6);
  }

  .sector-accordion {
    background:
      radial-gradient(120% 120% at 0% 0%, rgba(34,211,238,.08), transparent 50%),
      radial-gradient(120% 120% at 100% 100%, rgba(139,92,246,.1), transparent 50%),
      rgba(255,255,255,.04);
    transition: max-height .3s ease, opacity .25s ease;
  }
  .sector-accordion.hidden { display: none; }

  .tool-btn {
    padding: .35rem .8rem;
    border-radius: .9rem;
    font-size: .75rem;
    font-weight: 700;
    color: #fff;
    border: 1px solid rgba(34,211,238,.45);
    background: rgba(34,211,238,.1);
    transition: all .18s ease;
    white-space: nowrap;
  }
  .tool-btn .bv { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.1; }
  .tool-btn .bv .ar { font-family: 'VIP RAWY Regular', 'Segoe UI', sans-serif; direction: rtl; font-size: .82rem; text-align: center; }
  .tool-btn .bv .en { font-size: .6rem; letter-spacing: .05em; text-transform: uppercase; color: rgba(255,255,255,.72); }
  .tool-btn:hover { border-color: #22d3ee; background: rgba(34,211,238,.28); box-shadow: 0 0 12px rgba(34,211,238,.35); }
  .tool-btn.armed { background: linear-gradient(135deg, #22d3ee, #8b5cf6); border-color: transparent; box-shadow: 0 0 16px rgba(139,92,246,.6); }
  .tool-btn-danger { border-color: rgba(248,113,113,.5); background: rgba(248,113,113,.12); }
  .tool-btn-danger:hover { border-color: #f87171; background: rgba(248,113,113,.3); box-shadow: 0 0 12px rgba(248,113,113,.4); }

  #sector-modal { background: rgba(3,7,18,.72); backdrop-filter: blur(6px); }
  #sector-detail-modal { background: rgba(3,7,18,.72); backdrop-filter: blur(6px); }
  #sector-modal .sector-modal-card,
  #sector-detail-modal .sector-modal-card {
    background:
      radial-gradient(120% 120% at 0% 0%, rgba(34,211,238,.14), transparent 50%),
      radial-gradient(120% 120% at 100% 100%, rgba(139,92,246,.18), transparent 50%),
      rgba(13,21,36,.94);
    border: 1px solid rgba(34,211,238,.35);
    border-radius: 1rem;
    box-shadow: 0 0 30px rgba(34,211,238,.18), 0 0 60px rgba(139,92,246,.14), 0 20px 40px rgba(0,0,0,.5);
  }
  #sector-modal .sector-modal-title {
    color: #fff;
    text-shadow: 0 0 12px rgba(34,211,238,.6);
  }
  #sector-detail-modal .sector-modal-title {
    color: #fff;
    text-shadow: 0 0 12px rgba(34,211,238,.6);
  }
  #sector-modal input {
    width: 100%;
    border-radius: .75rem;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06);
    color: #fff;
    padding: .6rem .9rem;
    outline: none;
    transition: all .18s ease;
  }
  #sector-modal input::placeholder { color: rgba(226,232,240,.45); }
  #sector-detail-modal input, #sector-detail-modal select {
    border-radius: .75rem;
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.06);
    color: #fff;
  }
  #sector-detail-modal select option { color: #0b1220; }
  #sector-modal input:focus { border-color: #22d3ee; box-shadow: 0 0 14px rgba(34,211,238,.45); background: rgba(34,211,238,.06); }
  #sector-modal .sector-modal-msg { color: rgba(255,255,255,.72); }
  #sector-modal .sector-modal-btn {
    padding: .5rem 1.1rem;
    border-radius: .9rem;
    font-weight: 700;
    font-size: .75rem;
    color: #fff;
    border: 1px solid rgba(34,211,238,.45);
    background: linear-gradient(135deg, rgba(34,211,238,.2), rgba(139,92,246,.3));
    transition: all .18s ease;
    cursor: pointer;
    white-space: nowrap;
  }
  #sector-modal .sector-modal-btn:hover { box-shadow: 0 0 14px rgba(34,211,238,.5); transform: translateY(-1px); }
  #sector-modal .sector-modal-btn.danger { border-color: rgba(248,113,113,.55); background: linear-gradient(135deg, rgba(248,113,113,.25), rgba(220,38,38,.35)); }
  #sector-modal .sector-modal-btn.danger:hover { border-color: #f87171; box-shadow: 0 0 14px rgba(248,113,113,.5); }
  #sector-modal .sector-modal-btn.primary { border-color: transparent; background: linear-gradient(135deg, #22d3ee, #8b5cf6); box-shadow: 0 0 16px rgba(139,92,246,.4); }
  #sector-modal .sector-modal-btn.primary:hover { box-shadow: 0 0 20px rgba(139,92,246,.7); }
  #sector-modal .sector-modal-btn .bv { display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.15; }
  #sector-modal .sector-modal-btn .bv .ar { font-family: 'VIP RAWY Regular', 'Segoe UI', sans-serif; direction: rtl; font-size: .78rem; text-align: center; }
  #sector-modal .sector-modal-btn .bv .en { font-size: .6rem; letter-spacing: .04em; text-transform: uppercase; color: rgba(255,255,255,.7); }
  #sector-modal .sector-modal-title .di { display: flex; justify-content: space-between; gap: .6rem; }
  #sector-modal .sector-modal-title .di .ar { font-family: 'VIP RAWY Regular', 'Segoe UI', sans-serif; direction: rtl; font-size: .82rem; }
  #sector-modal .sector-modal-title .di .en { font-size: .82rem; }
  #sector-modal .sector-modal-msg .bv { display: flex; flex-direction: column; gap: 4px; }
  #sector-modal .sector-modal-msg .bv .ar { font-family: 'VIP RAWY Regular', 'Segoe UI', sans-serif; direction: rtl; font-size: .85rem; }
  #sector-modal .sector-modal-msg .bv .en { font-size: .8rem; color: rgba(255,255,255,.65); }

  #other-kind option, #sim-crop option, #zone-target option { color: #0b1220; }

  @media print {
    nav, footer, .tab-btn, #top-error, #sector-modal, #sector-detail-modal,
    #other-form, #sim-form, .confirm-zones-btn, .use-config-btn { display: none !important; }
    body { background: #fff; color: #000; }
    .tab-panel { display: block !important; }
    #final-report { color: #000; }
  }
</style>
</head>
<body class="min-h-screen font-sans antialiased" dir="ltr">

<nav class="sticky top-0 z-20 border-b border-white/10 bg-[#070b14]/70 backdrop-blur-md">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-4">
    <a class="text-xl font-bold tracking-wide" href="/">
      <span class="bg-gradient-to-r from-cyan-300 via-violet-400 to-fuchsia-400 bg-clip-text text-transparent">{{ tl('MODEL_NAME')[0] }}</span>
    </a>
    <span class="text-xl text-cyan-100/80" style="font-family:'VIP RAWY Regular';direction:rtl">{{ tl('MODEL_NAME')[1] }}</span>
  </div>
</nav>

<main class="mx-auto max-w-7xl px-4 py-6 pb-28">
  {% block content %}{% endblock %}
</main>

<footer class="fixed inset-x-0 bottom-0 z-20 border-t border-white/10 bg-[#070b14]/85 py-3 backdrop-blur-md">
  <div class="mx-auto grid max-w-7xl grid-cols-3 items-center gap-3 px-4 text-sm text-white/60">
    <div class="text-start">{{ tl('MODEL_NAME')[0] }}</div>
    <div class="text-center">
      {{ tl('PART1')[0] }} <span class="text-white/25">·</span> <span style="font-family:'VIP RAWY Regular';direction:rtl">{{ tl('PART1')[1] }}</span>
    </div>
    <div class="text-end text-cyan-200/80">v{{ version }}</div>
  </div>
</footer>

</body>
</html>
